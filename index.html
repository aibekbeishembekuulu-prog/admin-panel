<!DOCTYPE html>
<html lang="ky">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Tez Kargo — Admin</title>


<!-- =========================================
     QR SCANNER LIBRARY
========================================= -->

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.logo{
  font-size:26px;
  font-weight:800;
}

.subtitle{
  margin-top:5px;
  opacity:.7;
  font-size:13px;
}

.container{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.scan-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:16px;
}

#reader video{
  width:100% !important;
  border-radius:16px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.start{
  background:#111827;
  color:white;
}

.issue{
  background:#16a34a;
  color:white;
}

.reset{
  background:#e5e7eb;
  color:#111827;
}

.client{
  display:none;
}

.client-code{
  font-size:30px;
  font-weight:900;
  color:#dc2626;
  text-align:center;
  margin:10px 0 18px;
}

.status{
  padding:12px;
  border-radius:12px;
  text-align:center;
  margin-bottom:12px;
  background:#f3f4f6;
  font-weight:700;
}

.parcel{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}

.track{
  font-size:18px;
  font-weight:800;
}

.price{
  margin-top:5px;
  color:#6b7280;
}

.empty{
  text-align:center;
  padding:20px;
  color:#6b7280;
}

.loading{
  text-align:center;
  padding:20px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.count{
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin:10px 0;
}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

  <div class="logo">
    📦 TEZ KARGO
  </div>

  <div class="subtitle">
    ADMIN PANEL • QR ВЫДАЧА
  </div>

</div>


<div class="container">


<!-- =========================================
     🔎 TRACK SEARCH
========================================= -->

<div class="card">

  <div class="scan-title">
    🔎 TRACK CODE ИЗДӨӨ
  </div>

  <input
    type="text"
    id="trackSearchInput"
    placeholder="Track code жазыңыз..."
    autocomplete="off"
    style="
      width:100%;
      padding:15px;
      border:1px solid #d1d5db;
      border-radius:14px;
      font-size:16px;
      outline:none;
    "
  >

  <button
    class="start"
    onclick="searchTrack()">

    🔎 Издөө

  </button>

  <div
    id="trackSearchResult"
    style="margin-top:15px;">
  </div>

</div>


<!-- =========================================
     📷 QR SCANNER
========================================= -->

<div class="card">

  <div class="scan-title">
    📷 QR СКАНЕР
  </div>

  <div id="reader"></div>

  <button
    class="start"
    id="startButton"
    onclick="startScanner()">

    📷 Камераны ачуу

  </button>

  <button
    class="reset"
    onclick="stopScanner()">

    ✕ Камераны жабуу

  </button>

</div>



<!-- =========================================
     CLIENT
========================================= -->

<div
  class="card client"
  id="clientCard">


  <div class="status">
    👤 КЛИЕНТ
  </div>


  <div
    class="client-code"
    id="clientCode">
  </div>


  <div
    id="parcelStatus">
  </div>


  <div
    id="parcelList">
  </div>


  <button
    class="issue"
    id="issueButton"
    onclick="issueClient()">

    🟢 БАРДЫК ПОСЫЛКАНЫ БЕРҮҮ

  </button>


  <button
    class="reset"
    onclick="resetClient()">

    🔄 Башка кардарды сканерлөө

  </button>

</div>


</div>


<script>


/************************************************
⚙️ GOOGLE APPS SCRIPT API
************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbwVgYyCu8YuPxqhdkOra1F0FfSENe44ys-Ad_wRdQp3CfuR2ISzlWZ4Irt7_IFz3a_2/exec";


/************************************************
📷 SCANNER VARIABLES
************************************************/

let scanner = null;

let scannerRunning = false;

let isProcessingQR = false;


/************************************************
▶️ START SCANNER
************************************************/

async function startScanner(){

  if(scannerRunning){

    return;

  }


  const startButton =
    document.getElementById(
      "startButton"
    );


  try{


    startButton.disabled =
      true;


    startButton.textContent =
      "⏳ Камера ачылууда...";


    /**********************************************
    🧹 ЭСКИ SCANNER ТАЗАЛОО
    **********************************************/

    if(scanner){

      try{

        await scanner.stop();

      }catch(e){}


      try{

        await scanner.clear();

      }catch(e){}


      scanner =
        null;

    }


    /**********************************************
    📷 CAMERA OBJECT
    **********************************************/

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /**********************************************
    📱 КАМЕРАЛАРДЫ ТАБУУ
    **********************************************/

    const cameras =
      await Html5Qrcode.getCameras();


    console.log(
      "AVAILABLE CAMERAS:",
      cameras
    );


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        "Телефондо камера табылган жок."
      );

    }


    /**********************************************
    📷 АРТКЫ КАМЕРАНЫ ТАНДОО
    **********************************************/

    let cameraId =
      cameras[0].id;


    for(
      const camera of cameras
    ){

      const label =
        String(
          camera.label || ""
        ).toLowerCase();


      if(
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment") ||
        label.includes("арт")
      ){

        cameraId =
          camera.id;

        break;

      }

    }


    console.log(
      "SELECTED CAMERA:",
      cameraId
    );


    /**********************************************
    🚀 START CAMERA
    **********************************************/

    await scanner.start(

      cameraId,


      {

        fps:10,


        qrbox:function(
          width,
          height
        ){

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width:size,

            height:size

          };

        },


        aspectRatio:1.0

      },


      /********************************************
      ✅ QR FOUND
      ********************************************/

      function(decodedText){

        console.log(
          "✅ QR SCANNED:",
          decodedText
        );


        if(isProcessingQR){

          return;

        }


        isProcessingQR =
          true;


        handleQR(
          decodedText
        );


      },


      /********************************************
      ℹ️ QR ERROR
      ********************************************/

      function(errorMessage){

        // QR табылганга чейин
        // чыккан каталарды көрсөтпөйбүз.

      }

    );


    scannerRunning =
      true;


    startButton.disabled =
      false;


    startButton.textContent =
      "📷 Камера иштеп жатат";


    console.log(
      "✅ CAMERA STARTED"
    );


  }


  catch(error){


    console.error(
      "❌ CAMERA ERROR:",
      error
    );


    scannerRunning =
      false;


    if(scanner){

      try{

        await scanner.clear();

      }catch(e){}

      scanner =
        null;

    }


    startButton.disabled =
      false;


    startButton.textContent =
      "📷 Камераны ачуу";


    let message =
      "❌ Камера ачылган жок.\n\n";


    message +=
      "Chrome браузеринде камерага уруксат бериңиз.\n\n";


    message +=
      "Chrome → 🔒 → Камера → Уруксат берүү\n\n";


    message +=
      "Ката: " +
      error;


    alert(
      message
    );

  }

}


/************************************************
⛔ STOP SCANNER
************************************************/

async function stopScanner(){


  const startButton =
    document.getElementById(
      "startButton"
    );


  try{


    if(
      scanner &&
      scannerRunning
    ){

      await scanner.stop();

    }


  }catch(error){

    console.log(
      "STOP ERROR:",
      error
    );

  }


  try{


    if(scanner){

      await scanner.clear();

    }


  }catch(error){

    console.log(
      "CLEAR ERROR:",
      error
    );

  }


  scanner =
    null;


  scannerRunning =
    false;


  isProcessingQR =
    false;


  startButton.disabled =
    false;


  startButton.textContent =
    "📷 Камераны ачуу";

}


/************************************************
🔎 QR PROCESS
************************************************/

async function handleQR(qrText){


  /**********************************************
  ⛔ КАМЕРАНЫ ТОКТОТУУ
  **********************************************/

  await stopScanner();


  /**********************************************
  🔤 QR КОДДУ ТАЗАЛОО
  **********************************************/

  const clientCode =
    String(
      qrText || ""
    )
    .trim()
    .toUpperCase();


  console.log(
    "CLIENT CODE:",
    clientCode
  );


  /**********************************************
  ❌ QR БОШ
  **********************************************/

  if(!clientCode){

    alert(
      "❌ QR код бош."
    );

    isProcessingQR =
      false;

    return;

  }


  /**********************************************
  👤 КАРДАРДЫ ЖҮКТӨӨ
  **********************************************/

  loadClient(
    clientCode
  );

}


/************************************************
👤 CLIENT LOAD
************************************************/

function loadClient(
  clientCode
){

  const card =
    document.getElementById(
      "clientCard"
    );


  const code =
    document.getElementById(
      "clientCode"
    );


  const list =
    document.getElementById(
      "parcelList"
    );


  const status =
    document.getElementById(
      "parcelStatus"
    );


  const button =
    document.getElementById(
      "issueButton"
    );


  card.style.display =
    "block";


  code.textContent =
    clientCode;


  button.disabled =
    true;


  button.textContent =
    "⏳ Текшерилүүдө...";


  status.innerHTML = `

    <div class="loading">

      ⏳ Кардардын посылкалары
      текшерилүүдө...

    </div>

  `;


  list.innerHTML =
    "";


  /**********************************************
  📡 API CHECK CLIENT
  **********************************************/

  fetch(

    API_URL +

    "?action=check_client" +

    "&client_code=" +

    encodeURIComponent(
      clientCode
    )

  )


  .then(function(response){


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    return response.json();

  })


  .then(function(data){


    console.log(
      "CHECK CLIENT:",
      data
    );


    /********************************************
    ❌ CLIENT ERROR
    ********************************************/

    if(
      data.status !==
      "ok"
    ){

      status.innerHTML = `

        <div class="status error">

          ❌
          ${
            escapeHtml(
              data.message ||
              "Кардар табылган жок"
            )
          }

        </div>

      `;


      button.disabled =
        true;


      button.textContent =
        "❌ КАРДАР ТАБЫЛГАН ЖОК";


      return;

    }


    /********************************************
    📦 PARCELS
    ********************************************/

    const office =
      data.office_parcels ||
      [];


    const issued =
      data.issued_parcels ||
      [];


    /********************************************
    🟢 OFFICE PARCELS
    ********************************************/

    if(
      office.length > 0
    ){


      status.innerHTML = `

        <div class="status success">

          👤 Клиент:

          <b>
            ${escapeHtml(
              clientCode
            )}
          </b>

          <br><br>

          🏢 Офисте:

          <b>
            ${office.length}
          </b>

          посылка

        </div>

      `;


      renderOfficeParcels(
        office
      );


      button.disabled =
        false;


      button.textContent =
        "🟢 БАРДЫК ПОСЫЛКАНЫ БЕРҮҮ";

    }


    /********************************************
    ℹ️ NO OFFICE PARCELS
    ********************************************/

  else{

  status.innerHTML = `

    <div class="status">

      👤 Клиент:

      <b>
        ${escapeHtml(
          clientCode
        )}
      </b>

      <br><br>

      📦 Офисте посылка жок.

      <br>

      ✅ Мурун берилген:

      ${issued.length}

    </div>

  `;


  /********************************************
  ✅ SHOW ISSUED PARCELS
  ********************************************/

  renderIssued(
    [],
    issued
  );


  button.disabled =
    true;


  button.textContent =
    "✅ БЕРҮҮ ҮЧҮН ПОСЫЛКА ЖОК";

}
  })


  .catch(function(error){


    console.error(
      "CHECK ERROR:",
      error
    );


    status.innerHTML = `

      <div class="status error">

        ❌ API менен байланыш жок.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;


    button.disabled =
      true;


    button.textContent =
      "❌ КАТА";

  });

}


/************************************************
📦 SHOW OFFICE PARCELS
************************************************/

function renderOfficeParcels(parcels){

  const list =
    document.getElementById("parcelList");


  if(!parcels.length){

    list.innerHTML = `
      <div class="empty">
        📦 Офисте посылка жок.
      </div>
    `;

    return;

  }


  // 💰 ЖАЛПЫ СУММА
  let totalPrice = 0;


  parcels.forEach(function(parcel){

    let price =
      Number(
        String(parcel.price || "")
          .replace(",", ".")
          .replace(/[^\d.-]/g, "")
      ) || 0;

    totalPrice += price;

  });


  let html = `

    <div class="count">

      🏢 ОФИСТЕГИ ПОСЫЛКАЛАР:
      ${parcels.length}

    </div>


    <div class="status success"
         style="
           font-size:22px;
           margin:15px 0;
           padding:18px;
         ">

      💰 ЖАЛПЫ СУММА:

      <br>

      <b style="font-size:30px;">
        ${totalPrice.toLocaleString("ru-RU")} сом
      </b>

    </div>

  `;


  parcels.forEach(function(parcel){

    html += `

      <div class="parcel">

        <div class="track">

          📦
          ${escapeHtml(
            parcel.track
          )}

        </div>


        <div class="price">

          💰
          ${
            parcel.price === "" ||
            parcel.price == null
              ? "Баасы көрсөтүлгөн эмес"
              : escapeHtml(
                  String(parcel.price)
                ) + " сом"
          }

        </div>


        <div class="price">

          🏢
          ${escapeHtml(
            parcel.status
          )}

        </div>


        <div class="price">

          📅 Келген:
          ${escapeHtml(
            parcel.date_arrived || ""
          )}

        </div>

      </div>

    `;

  });


  list.innerHTML = html;

}
/************************************************
📦 SHOW ISSUED
************************************************/

function renderIssued(
  issued,
  already
){

  const list =
    document.getElementById(
      "parcelList"
    );


  let html =
    "";


  if(
    issued.length > 0
  ){

    html += `

      <div class="count">

        📦 Жаңы берилген:

        ${issued.length}

      </div>

    `;


    issued.forEach(
      function(parcel)
    {

      html += `

        <div class="parcel">

          <div class="track">

            📦

            ${escapeHtml(
              parcel.track
            )}

          </div>


          <div class="price">

            💰

            ${escapeHtml(
              String(
                parcel.price || ""
              )
            )}

          </div>


          <div class="price">

            🟢 Выдано

          </div>

        </div>

      `;

    });

  }


  if(
    already.length > 0
  ){

    html += `

      <div class="count">

        ℹ️ Мурун берилген:

        ${already.length}

      </div>

    `;


    already.forEach(
      function(parcel)
    {

      html += `

        <div class="parcel">

          <div class="track">

            📦

            ${escapeHtml(
              parcel.track
            )}

          </div>


          <div class="price">

            💰

            ${escapeHtml(
              String(
                parcel.price || ""
              )
            )}

          </div>


          <div class="price">

            ✅ Уже выдано

          </div>

        </div>

      `;

    });

  }


  if(!html){

    html = `

      <div class="empty">

        📦 Посылка жок.

      </div>

    `;

  }


  list.innerHTML =
    html;

}

/************************************************
🔎 SEARCH TRACK CODE
************************************************/

function searchTrack(){

  const input =
    document.getElementById(
      "trackSearchInput"
    );

  const result =
    document.getElementById(
      "trackSearchResult"
    );

  const trackCode =
    String(
      input.value || ""
    )
    .trim();

  if(!trackCode){

    result.innerHTML = `
      <div class="status error">
        ❌ Track code жазыңыз
      </div>
    `;

    return;

  }


  result.innerHTML = `
    <div class="loading">
      ⏳ Изделүүдө...
    </div>
  `;


  fetch(

    API_URL +
    "?action=search_track" +
    "&track_code=" +
    encodeURIComponent(
      trackCode
    )

  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(data){

    console.log(
      "🔎 SEARCH TRACK:",
      data
    );


    /****************************************
    ❌ ТАБЫЛГАН ЖОК
    ****************************************/

    if(
      data.status !== "ok"
    ){

      result.innerHTML = `

        <div class="status error">

          ❌ Посылка табылган жок

          <br><br>

          Track:
          <b>
            ${escapeHtml(
              trackCode
            )}
          </b>

        </div>

      `;

      return;

    }


    /****************************************
    📦 DATA
    ****************************************/

    const parcel =
      data.parcel || {};

    const client =
      data.client || null;


    /****************************************
    📦 ПОСЫЛКА
    ****************************************/

    let html = `

      <div class="status success">

        ✅ ПОСЫЛКА ТАБЫЛДЫ

      </div>


      <div class="parcel">

        <div class="track">

          📦
          ${escapeHtml(
            parcel.track || ""
          )}

        </div>


        <div class="price">

          👤 Клиент:

          <b>
            ${escapeHtml(
              parcel.client_code || ""
            )}
          </b>

        </div>


        <div class="price">

          💰 Баасы:

          ${
            parcel.price === "" ||
            parcel.price == null

            ?

            "Көрсөтүлгөн эмес"

            :

            escapeHtml(
              String(
                parcel.price
              )
            ) +
            " сом"
          }

        </div>


        <div class="price">

          📌 Статус:

          <b>
            ${escapeHtml(
              parcel.status || ""
            )}
          </b>

        </div>


        <div class="price">

          📅 Жөнөтүлгөн:

          ${escapeHtml(
            parcel.date_sent || ""
          )}

        </div>


        <div class="price">

          📅 Келген:

          ${escapeHtml(
            parcel.date_arrived || ""
          )}

        </div>

      </div>

    `;


    /****************************************
    👤 CLIENT
    ****************************************/

    if(client){

      html += `

        <div class="parcel">

          <div class="track">

            👤 КЛИЕНТ

          </div>


          <div class="price">

            👤 Аты:

            ${escapeHtml(
              String(
                client.name || ""
              )
            )}

          </div>


          <div class="price">

            📞 Телефон:

            ${escapeHtml(
              String(
                client.phone || ""
              )
            )}

          </div>


          <div class="price">

            🏠 Дарек:

            ${escapeHtml(
              String(
                client.address || ""
              )
            )}

          </div>


          <div class="price">

            🔑 Клиенттик код:

            <b>
              ${escapeHtml(
                String(
                  client.client_code || ""
                )
              )}
            </b>

          </div>

        </div>

      `;

    }


    /****************************************
    🔘 ЭГЕР В ОФИСЕ БОЛСО
    ****************************************/

    const statusText =
      String(
        parcel.status || ""
      )
      .toLowerCase()
      .trim();


    if(
      statusText.includes(
        "в офис"
      )
    ){

      html += `

        <button
          class="issue"
          onclick="issueFromSearch(
            '${escapeHtml(
              parcel.client_code || ""
            )}'
          )">

          🟢 КАРДАРДЫН ПОСЫЛКАЛАРЫН БЕРҮҮ

        </button>

      `;

    }


    result.innerHTML =
      html;

  })


  .catch(function(error){

    console.error(
      "❌ SEARCH ERROR:",
      error
    );


    result.innerHTML = `

      <div class="status error">

        ❌ Сервер менен байланыш жок.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  });

}


/************************************************

************************************************/

function issueFromSearch(
  clientCode
){

  clientCode =
    String(
      clientCode || ""
    )
    .trim()
    .toUpperCase();


  if(!clientCode){

    alert(
      "❌ Клиенттик код жок."
    );

    return;

  }
      if(!confirm(

    "📦 " +
    clientCode +
    " кардардын офистеги бардык посылкаларын беребизби?"

  )){

    return;

  }


  const result =
    document.getElementById(
      "trackSearchResult"
    );


  result.innerHTML = `

    <div class="loading">

      ⏳ Посылкалар берилүүдө...

    </div>

  `;


  fetch(

    API_URL +

    "?action=issue_client" +

    "&client_code=" +

    encodeURIComponent(
      clientCode
    )

  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    return response.json();

  })

  .then(function(data){

    console.log(
      "📦 ISSUE FROM SEARCH:",
      data
    );


    if(
      data.status === "ok"
    ){

      const count =
        data.issued_count || 0;


      result.innerHTML = `

        <div class="status success">

          ✅ ПОСЫЛКАЛАР БЕРИЛДИ

          <br><br>

          👤 Кардар:
          <b>
            ${escapeHtml(
              clientCode
            )}
          </b>

          <br>

          📦 Берилди:
          <b>
            ${count}
          </b>

        </div>

      `;


      alert(

        "✅ Даяр!\n\n" +

        "Кардар: " +
        clientCode +

        "\nБерилген посылка: " +
        count

      );


      /****************************************
      🔄 SEARCH'ТИ ЖАҢЫЛОО
      ****************************************/

      const input =
        document.getElementById(
          "trackSearchInput"
        );


      if(input){

        input.value = "";

      }

    }

    else{

      result.innerHTML = `

        <div class="status error">

          ❌

          ${escapeHtml(
            data.message ||
            "Посылканы берүүдө ката кетти"
          )}

        </div>

      `;

    }

  })

  .catch(function(error){

    console.error(
      "❌ ISSUE ERROR:",
      error
    );


    result.innerHTML = `

      <div class="status error">

        ❌ Сервер менен байланыш жок.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  });

}
/************************************************
🟢 ISSUE CLIENT
************************************************/

function issueClient(){


  const clientCode =
    document
      .getElementById(
        "clientCode"
      )
      .textContent
      .trim();


  if(!clientCode){

    alert(
      "❌ Клиент тандалган жок."
    );

    return;

  }


  if(!confirm(

    "📦 " +
    clientCode +
    " кардардын офистеги бардык посылкаларын беребизби?"

  )){

    return;

  }


  const button =
    document.getElementById(
      "issueButton"
    );


  button.disabled =
    true;


  button.textContent =
    "⏳ Посылкалар берилүүдө...";


  /**********************************************
  📡 ISSUE API
  **********************************************/

  fetch(

    API_URL +

    "?action=issue_client" +

    "&client_code=" +

    encodeURIComponent(
      clientCode
    )

  )


  .then(function(response){

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    return response.json();

  })


  .then(function(data){


    console.log(
      "ISSUE API:",
      data
    );


    if(
      data.status ===
      "ok"
    ){


      const count =
        data.issued_count ||
        0;


      button.textContent =
        "✅ БЕРИЛДИ";


      alert(

        "✅ Даяр!\n\n" +

        "Кардар: " +
        clientCode +

        "\nБерилген посылка: " +
        count

      );


      /******************************************
      🔄 REFRESH CLIENT
      ******************************************/

      loadClient(
        clientCode
      );

    }


    else{


      alert(

        "❌ " +

        (
          data.message ||
          "Посылканы берүүдө ката кетти"
        )

      );


      button.disabled =
        false;


      button.textContent =
        "🟢 БАРДЫК ПОСЫЛКАНЫ БЕРҮҮ";

    }

  })


  .catch(function(error){


    console.error(
      "ISSUE ERROR:",
      error
    );


    alert(
      "❌ Сервер менен байланыш жок."
    );


    button.disabled =
      false;


    button.textContent =
      "🟢 БАРДЫК ПОСЫЛКАНЫ БЕРҮҮ";

  });

}

/************************************************
🛡️ ESCAPE HTML
************************************************/

function escapeHtml(
  text
){

  return String(
    text
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
